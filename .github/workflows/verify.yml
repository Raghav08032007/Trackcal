name: Verify TrackCal
on: [push, pull_request]
permissions: { contents: read }
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Require packaged frontend source
        run: test -f frontend/web/package-lock.json || { echo 'Package the frontend source or configure its gitlink as an accessible submodule.'; exit 1; }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/web/package-lock.json }
      - run: npm ci
        working-directory: frontend/web
      - run: npm test && npm run lint && npm run build && npm audit --omit=dev
        working-directory: frontend/web
  api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [flask, fastapi]  # parity during the Flask migration; drop fastapi when it is removed
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-disposable-password
          MYSQL_DATABASE: trackcal_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -h localhost --silent" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_SECRET_KEY: ci-only-disposable-signing-secret-for-tests
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-only-disposable-password
      DB_NAME: trackcal_test
      AI_MOCK_MODE: "true"
      TRACKCAL_BACKEND: ${{ matrix.backend }}
      NLTK_DATA: nltk_data
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "backend/requirements*.txt" }
      - run: pip install -r requirements-dev.txt
      - run: python -m nltk.downloader -d nltk_data averaged_perceptron_tagger_eng
      - run: python scripts/bootstrap_schema.py
      - run: python -m pytest tests -q --disable-warnings
      - run: pip check
